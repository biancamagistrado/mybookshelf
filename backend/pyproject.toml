[project]
name = "mybookshelf-api"
version = "1.0.0"
description = "FastAPI backend for My Bookshelf, a personal reading tracker"
requires-python = ">=3.12"

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "DTZ"]
ignore = [
    "B008",
    "DTZ007",
    "DTZ011",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SLF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
